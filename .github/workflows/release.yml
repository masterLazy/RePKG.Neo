name: Build and Release

# Execute when push a tag with SemVer (stable, beta, rc) — alpha is excluded.
on:
  push:
    tags:
      - '*.*.*'
      - '!*.*.*-alpha*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:

      # 0. Check the tag and detect the channel

      - name: Validate tag and detect channel
        id: tag
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Validating tag: $tag"

          # Accept:  1.2.3, 1.2.3-beta, 1.2.3-beta.1, 1.2.3-rc, 1.2.3-rc.1
          # Reject:  anything else (alpha should already be filtered out by on.push.tags)
          if ($tag -notmatch '^\d+\.\d+\.\d+(-(beta|rc)(\.\d+)?)?$') {
            Write-Host "##[error] Tag '$tag' is not a valid release tag. Exiting."
            exit 1
          }
          Write-Host "Tag format is valid."

          $isPrerelease = $tag -match '-(beta|rc)'
          Write-Host "Is prerelease: $isPrerelease"
          "is_prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 1. Prepare env

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 2. Dotnet build

      - name: Restore dependencies
        run: dotnet restore RePKG.Neo/RePKG.Neo.csproj

      - name: Build project
        run: dotnet build RePKG.Neo/RePKG.Neo.csproj -c Release --no-restore

      # 3. Run Inno Setup

      - name: Build Inno Setup x64 installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: .innoSetup/setup-x64.iss

      - name: Build Inno Setup x86 installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: .innoSetup/setup-x86.iss

      # 4. Release

      - name: Read release notes
        id: release_note
        run: |
          $notes = Get-Content -Path RELEASE-NOTES.md -Raw
          echo "notes<<EOF" >> $env:GITHUB_OUTPUT
          echo $notes >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release_note.outputs.notes }}
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
          files: |
            .innoSetup/*.exe